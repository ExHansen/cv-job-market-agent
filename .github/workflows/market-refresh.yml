name: Daily Job Market Sync (08:00 WIB)

on:
  schedule:
    # Runs every day at 01:00 UTC (08:00 WIB / Jakarta time)
    - cron: "0 1 * * *"
  workflow_dispatch:
    inputs:
      hours_old:
        description: "Lookback window in hours (default: 72)"
        required: false
        default: "72"

permissions:
  contents: write

jobs:
  daily-sync:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up uv & Python 3.12
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Install scraping + dbt dependencies
        run: uv sync --extra scraping --extra v2

      - name: Run daily Indonesia + Global Remote job ingestion & dbt build
        env:
          HOURS_OLD: ${{ github.event.inputs.hours_old || '72' }}
        run: |
          uv run cv-agent daily-sync --hours-old "$HOURS_OLD"
          uv run python -c "from cv_agent.storage.companies_db import CompanyKnowledgeDatabase; CompanyKnowledgeDatabase()"
          DUCKDB_PATH=../data/market.duckdb uv run dbt build --profiles-dir ../data_platform/dbt --project-dir ../data_platform/dbt

      - name: Commit updated daily snapshot to repo
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/snapshots/
          if git diff --staged --quiet; then
            echo "No new job snapshot changes to commit."
          else
            git commit -m "chore(data): daily job market snapshot $(date -u +'%Y-%m-%d')"
            git push
          fi
